name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: .agent/logs/playwright
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install website and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check shell syntax, repository, static builds and browser behavior
        run: |
          bash -n agent-loop.sh
          make check
